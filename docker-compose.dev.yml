# Development: backend only, no gluetun. Traffic is not VPN-routed.
# Usage: docker compose -f docker-compose.dev.yml --env-file .env up --build
services:
  backend:
    build: ./backend
    container_name: aestor-backend-dev
    restart: unless-stopped
    ports:
      - "${EXTERNAL_PORT:-8080}:8080"
    environment:
      - DEV_MODE=true
      - WEB_PASSWORD=${WEB_PASSWORD:-dev-password}
      - SESSION_SECRET=${SESSION_SECRET:-dev-session-secret-change-me}
      - API_BEARER_TOKEN=${API_BEARER_TOKEN:-dev-api-token-change-me}
      - NTFY_ENABLED=${NTFY_ENABLED:-false}
      - NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - NTFY_PRIORITY=${NTFY_PRIORITY:-3}
      - NTFY_EVENTS=${NTFY_EVENTS:-completed,failed}
    volumes:
      - ./data/downloads:/data/downloads
      - ./data/completed:/data/completed
      - ./data/keys/public.pem:/keys/public.pem:ro
      - ./backend/app:/app/app
