# Production stack: all backend traffic exits via gluetun (kill switch on).
# Credentials: copy .env.example → .env and fill VPN_* / WIREGUARD_* / OPENVPN_*.
services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: aestor-gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # Backend HTTP (published via gluetun network namespace)
      - "8080:8080"
    volumes:
      - ./gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-}
      - OPENVPN_USER=${OPENVPN_USER:-}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:-}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-}
      # Kill switch: never allow clearnet if the tunnel drops
      - FIREWALL=on
      - FIREWALL_VPN_INPUT_PORTS=8080
      - HTTP_CONTROL_SERVER_ADDRESS=:8001
      - DOT=on
      - BLOCK_MALICIOUS=off
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  backend:
    build: ./backend
    container_name: aestor-backend
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - DEV_MODE=false
      - WEB_PASSWORD=${WEB_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - API_BEARER_TOKEN=${API_BEARER_TOKEN}
      - NTFY_ENABLED=${NTFY_ENABLED:-false}
      - NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - NTFY_PRIORITY=${NTFY_PRIORITY:-3}
      - NTFY_EVENTS=${NTFY_EVENTS:-completed,failed,vpn}
    volumes:
      - ./data/downloads:/data/downloads
      - ./data/completed:/data/completed
      - ./data/keys/public.pem:/keys/public.pem:ro
    # No ports here — published on gluetun service
